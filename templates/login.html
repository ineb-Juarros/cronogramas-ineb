{% extends 'base.html' %}
{% block title %}Iniciar Sesión · Cronogramas INEB{% endblock %}

{% block content %}
<div class="auth-box">
  <h2>🔐 Iniciar Sesión</h2>
  <p class="auth-sub">Sistema de Cronogramas de Actividades Bimestrales</p>

  <form method="POST" action="{{ url_for('login') }}">
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required
             placeholder="maestro@ineb.edu.gt" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required
             placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button type="submit" class="btn btn-primary btn-full">Entrar</button>
  </form>

  <p class="auth-link">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate aquí</a></p>
</div>
{% endblock %}
