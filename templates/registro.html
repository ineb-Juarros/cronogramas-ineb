{% extends 'base.html' %}
{% block title %}Registro · Cronogramas INEB{% endblock %}

{% block content %}
<div class="auth-box">
  <h2>📝 Crear cuenta</h2>
  <p class="auth-sub">Ingresa tus datos para registrarte como catedrático</p>

  <form method="POST" action="{{ url_for('registro') }}">
    <div class="form-group">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" name="nombre" required
             placeholder="Prof. Ana García" autocomplete="name" />
    </div>
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" required
             placeholder="agarcia@ineb.edu.gt" autocomplete="email" />
    </div>
    <div class="form-group">
      <label for="password">Contraseña <small>(mínimo 6 caracteres)</small></label>
      <input type="password" id="password" name="password" required
             placeholder="••••••••" autocomplete="new-password" minlength="6" />
    </div>
    <div class="form-group">
      <label for="confirm">Confirmar contraseña</label>
      <input type="password" id="confirm" name="confirm" required
             placeholder="••••••••" autocomplete="new-password" minlength="6" />
    </div>
    <button type="submit" class="btn btn-primary btn-full">Crear cuenta</button>
  </form>

  <p class="auth-link">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</div>
{% endblock %}
